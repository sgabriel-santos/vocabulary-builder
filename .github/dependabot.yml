version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    groups:
      backend:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      # TS 7 (nativo, sem API de compilador em JS) quebra typescript-eslint e openapi-typescript
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    groups:
      docker:
        patterns: ["*"]
    ignore:
      # Python 3.15 bloqueado pelo spaCy (ADR 0004); Node só em versões LTS (ADR 0005)
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
