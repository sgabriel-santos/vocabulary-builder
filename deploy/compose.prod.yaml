name: vocab

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      # Postgres 18+ usa /var/lib/postgresql, não /var/lib/postgresql/data
      - db_data:/var/lib/postgresql
    healthcheck:
      # $$: variáveis lidas dentro do container, não interpoladas pelo Compose
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1", memory: 1g }
    logging: *logging

  migrate:
    image: ghcr.io/sgabriel-santos/vocab-api:${IMAGE_TAG:?defina IMAGE_TAG (SHA do commit)}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    env_file: ../.env
    secrets: [postgres_password]
    depends_on:
      db: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }
    logging: *logging

  api:
    image: ghcr.io/sgabriel-santos/vocab-api:${IMAGE_TAG:?defina IMAGE_TAG (SHA do commit)}
    restart: unless-stopped
    env_file: ../.env
    secrets: [postgres_password]
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "1", memory: 1g }
    logging: *logging

  web:
    image: ghcr.io/sgabriel-santos/vocab-web:${IMAGE_TAG:?defina IMAGE_TAG (SHA do commit)}
    restart: unless-stopped
    ports:
      - "127.0.0.1:9001:80"
    depends_on: [api]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }
    logging: *logging

secrets:
  postgres_password:
    # Criado à mão na VPS (deploy/README.md); o rsync do deploy não o toca
    file: ./secrets/postgres_password

volumes:
  db_data:
