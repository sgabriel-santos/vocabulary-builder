# Compose de PRODUÇÃO (VPS). Desenvolvimento usa o compose.yaml da raiz.
# Executado pelo deploy.sh a partir de /opt/vocab/deploy:
#   IMAGE_TAG=<sha> docker compose --env-file /opt/vocab/.env -f compose.prod.yaml up -d
# Só o `web` publica portas. Nunca montar /var/run/docker.sock.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      # Postgres 18+: montar em /var/lib/postgresql (não em /var/lib/postgresql/data)
      - db_data:/var/lib/postgresql
    healthcheck:
      # $$ escapa a interpolação do Compose: as variáveis são lidas dentro do container
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1", memory: 1g }
    logging: *logging

  # One-off: aplica as migrações antes de a api subir (depends_on da api)
  migrate:
    image: ghcr.io/sgabriel-santos/vocab-api:${IMAGE_TAG:?defina IMAGE_TAG (SHA do commit)}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    env_file: ../.env
    secrets: [postgres_password]
    depends_on:
      db: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }
    logging: *logging

  api:
    image: ghcr.io/sgabriel-santos/vocab-api:${IMAGE_TAG:?defina IMAGE_TAG (SHA do commit)}
    restart: unless-stopped
    env_file: ../.env
    secrets: [postgres_password]
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "1", memory: 1g }
    logging: *logging

  web:
    image: ghcr.io/sgabriel-santos/vocab-web:${IMAGE_TAG:?defina IMAGE_TAG (SHA do commit)}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?defina APP_DOMAIN no .env}
    volumes:
      # Obrigatórios: guardam os certificados. Recriá-los esbarra no rate limit do Let's Encrypt.
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }
    logging: *logging

# Rede única (a default do projeto): os serviços se enxergam pelo nome; só o web tem portas no host.

secrets:
  postgres_password:
    # Criado à mão no VPS (ver README.md). Não versionado; o rsync do deploy não o toca.
    file: ./secrets/postgres_password

volumes:
  db_data:
  caddy_data:
  caddy_config:
